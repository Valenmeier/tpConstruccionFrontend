spring.application.name=socioclub
server.port=8081

# Leer el .env.local de la raíz del proyecto
spring.config.import=optional:file:../.env.local[.properties]

# Base de datos
spring.datasource.url=${SPRING_DB_URL}
spring.datasource.username=${SPRING_DB_USER}
spring.datasource.password=${SPRING_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false