spring.application.name=socioclub

# Puerto del backend. Usamos 8081 porque en la compu de Juan el 8080 lo ocupa Apache.
server.port=8081

# Conexión a MySQL (la base se crea con base-datos/socioclub.sql y base-datos/crear-usuario.sql).
# MySQL corre en el puerto 3307 porque el 3306 lo usa otra base. Si tu MySQL está en 3306, cambialo acá.
spring.datasource.url=jdbc:mysql://localhost:3307/socioclub
spring.datasource.username=socioclub
spring.datasource.password=socioclub

# Las tablas las crea el script SQL: Hibernate no las crea ni las modifica.
spring.jpa.hibernate.ddl-auto=none

# Muestra en la consola el SQL que arma Hibernate.
spring.jpa.show-sql=true

# Las consultas a la base se hacen solo en el servicio (y evita un aviso al arrancar).
spring.jpa.open-in-view=false
